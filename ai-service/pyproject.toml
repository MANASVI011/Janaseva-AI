[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janaseva-ai-service"
version = "0.1.0"
description = "FastAPI service for the Janaseva AI demonstration platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "groq>=0.31,<1.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1.0",
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
